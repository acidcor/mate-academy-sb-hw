databaseChangeLog:
  - changeSet:
      id: create-categoty-table
      author: acor
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(32)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: varchar(256)
