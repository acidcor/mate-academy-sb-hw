databaseChangeLog:
  - changeSet:
      id: create-shopping-cart-table
      author: acor
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_shopping_carts
                  name: id
                  type: BIGINT
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: shopping_carts
            constraintName: FK_SHOPPING_CART_USER
            referencedColumnNames: id
            referencedTableName: users
