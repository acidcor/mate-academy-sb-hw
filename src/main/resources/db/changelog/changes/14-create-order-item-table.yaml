databaseChangeLog:
  - changeSet:
      id: create-order-item-table
      author: acor
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id
                  type: BIGINT
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: book_id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: quantity
                  type: INT
              - column:
                  constraints:
                    nullable: false
                  name: price
                  type: decimal
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseColumnNames: book_id
            baseTableName: order_items
            constraintName: fk_order_items_on_books
            referencedColumnNames: id
            referencedTableName: books

        - addForeignKeyConstraint:
            baseColumnNames: order_id
            baseTableName: order_items
            constraintName: fk_order_items_on_order
            referencedColumnNames: id
            referencedTableName: orders