databaseChangeLog:
  - changeSet:
      id: create-order-order-item-table
      author: acor
      changes:
        - createTable:
            tableName: orders_order_items
            columns:
              - column:
                  name: order_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_item_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: orders_order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_id_order_items

        - addForeignKeyConstraint:
            baseTableName: orders_order_items
            baseColumnNames: order_item_id
            referencedTableName: order_items
            referencedColumnNames: id
            constraintName: fk_order_order_items_id

