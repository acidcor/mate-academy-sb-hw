databaseChangeLog:
  - changeSet:
      id: create-carts_cart_items
      author: acor
      changes:
        - createTable:
            tableName: shopping_carts_cart_items
            columns:
              - column:
                  name: shopping_cart_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: cart_item_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: shopping_carts_cart_items
            baseColumnNames: shopping_cart_id
            referencedTableName: shopping_carts
            referencedColumnNames: id
            constraintName: fk_carts_items_cart_id

        - addForeignKeyConstraint:
            baseTableName: shopping_carts_cart_items
            baseColumnNames: cart_item_id
            referencedTableName: cart_items
            referencedColumnNames: id
            constraintName: fk_carts_items_item_id

        